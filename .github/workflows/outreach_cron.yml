name: Automated Research & Draft Generation (Review Queue Only)

# ==============================================================================
# HUMAN-IN-THE-LOOP SAFETY GUARANTEE:
# This workflow NEVER approves drafts and NEVER sends emails.
# Its sole function is to autonomously gather website intelligence, build
# research dossiers, and generate personalized drafts for prospects.
# Every generated draft is saved with status "AWAITING_REVIEW" in Supabase.
# Sending strictly and exclusively requires a human operator to log into the
# Streamlit dashboard and click "Approve & Send".
# ==============================================================================

on:
  workflow_dispatch:
  # Uncomment the schedule below to automatically research and draft leads Mon-Fri at 9:00 AM UTC:
  # schedule:
  #   - cron: '0 9 * * 1-5'

jobs:
  research-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Research & Generate Drafts for Review
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: 'True'
        run: |
          echo "=== STEP 1: Researching pending contacts ==="
          python -m src.cli research
          echo "=== STEP 2: Generating anti-slop personalized drafts ==="
          python -m src.cli generate
          echo "=== STEP 3: Review queue status ==="
          python -m src.cli stats
