sender:
  name: "Nillohit Debnath"
  email: "nillohitfreelanceco@gmail.com"
  role: "Founder at almost normal"
  bio: "We build websites and AI automation at almost normal, helping local businesses get more clients and automate bookings."


outreach:
  purpose: "sales"
  offer: "Professional websites and AI automation (such as automatic replies to customer questions and bookings) for small local businesses."
  ideal_contact: "Owners and managers of small local businesses: shops, salons, clinics, restaurants."
  call_to_action: "Ask them to simply reply to the message."

style:
  tone: "polite, professional, concise"
  avoid: ["I hope this finds you well", "synergy", "emojis", "long introductions"]
  language: "English"

limits:
  linkedin_connection_note_chars: 300
  linkedin_message_chars: 600
  email_words: "100-150"
  # Set to 5/day during the initial 2-week inbox warm-up period to build sender reputation
  # and prevent brand-new Gmail accounts from triggering spam filters or rate limits.
  # Can be gradually scaled up (e.g. to 10, then 20/day) after the warm-up window.
  emails_per_day: 5
  delay_between_sends_seconds: [90, 240]

llm:
  provider: "gemini"

database:
  backend: "auto"  # "auto", "supabase", or "sqlite"
  sqlite_path: "outreach.db"

